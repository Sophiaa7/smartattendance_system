<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Faces - {{ name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        #video { width: 100%; max-width: 640px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); transform: scaleX(-1); }
        .counter { font-size: 1.4rem; font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Smart Attendance</a>
        <a href="/add_student" class="btn btn-sm btn-outline-light">Back</a>
    </div>
</nav>

<div class="container text-center mt-4">
    <h3>Capturing faces for: <span class="text-primary" id="student-name">{{ name }}</span></h3>
    <p class="text-muted">Look at the camera. Click "Start Auto Capture" to collect dataset images automatically.</p>

    <div class="my-3 position-relative d-inline-block">
        <!-- Replaced cloud-breaking <img> with a browser-accessible HTML5 <video> -->
        <video id="video" autoplay playsinline width="640" height="480"></video>
        <canvas id="canvas" width="640" height="480" class="d-none"></canvas>
    </div>

    <div class="counter mb-3">
        Photos saved: <span id="count">0</span> / 100
    </div>

    <div class="d-flex justify-content-center gap-2 mb-3">
        <button id="captureBtn" class="btn btn-success btn-lg px-4">Capture Single Photo</button>
        <button id="autoBtn" class="btn btn-primary btn-lg px-4">Start Auto Capture</button>
    </div>

    <div id="status" class="mt-3" style="max-width: 500px; margin: 0 auto;"></div>

    <div class="mt-4">
        <a href="/train_model" class="btn btn-warning fw-bold text-dark">Train Model Now</a>
        <a href="/add_student" class="btn btn-outline-secondary">Add Another Student</a>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const captureBtn = document.getElementById('captureBtn');
    const autoBtn = document.getElementById('autoBtn');
    const statusDiv = document.getElementById('status');
    const countSpan = document.getElementById('count');
    const studentName = document.getElementById('student-name').innerText;

    let isAutoCapturing = false;
    let autoInterval = null;

    // 1. Get browser camera streams cleanly across HTTPS on Render
    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => {
            console.error("Camera access error:", err);
            statusDiv.innerHTML = `<div class="alert alert-danger">❌ Camera access blocked by browser.</div>`;
        });

    // 2. Base core logic function to capture a frame and send base64 data to Flask
    async function captureAndSend() {
        if (!video.srcObject) return;
        
        ctx.drawImage(video, 0, 0, 640, 480);
        const frameData = canvas.toDataURL('image/jpeg', 0.85);

        try {
            const response = await fetch(`/save_face/${studentName}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: frameData })
            });
            const data = await response.json();

            if (data.success) {
                countSpan.innerText = data.count;
                statusDiv.innerHTML = `<div class="alert alert-success py-1">${data.message}</div>`;
                
                if (parseInt(data.count) >= 100 && isAutoCapturing) {
                    stopAutoCapture();
                    statusDiv.innerHTML = `<div class="alert alert-info fw-bold">🎯 Dataset complete! You can now train the model.</div>`;
                }
            } else {
                statusDiv.innerHTML = `<div class="alert alert-warning py-1">${data.message}</div>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<div class="alert alert-danger py-1">Network error saving image</div>`;
        }
    }

    // Manual Single Shot Button Action
    captureBtn.addEventListener('click', async () => {
        captureBtn.disabled = true;
        await captureAndSend();
        captureBtn.disabled = false;
    });

    // Auto Capture Toggle Button Action
    autoBtn.addEventListener('click', () => {
        if (isAutoCapturing) {
            stopAutoCapture();
        } else {
            startAutoCapture();
        }
    });

    function startAutoCapture() {
        isAutoCapturing = true;
        autoBtn.innerText = "Stop Auto Capture";
        autoBtn.classList.replace('btn-primary', 'btn-danger');
        // Automatically save a frame every 250 milliseconds
        autoInterval = setInterval(captureAndSend, 250);
    }

    function stopAutoCapture() {
        isAutoCapturing = false;
        autoBtn.innerText = "Start Auto Capture";
        autoBtn.classList.replace('btn-danger', 'btn-primary');
        clearInterval(autoInterval);
    }
</script>

</body>
</html>
