<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        video { width: 100%; max-width: 640px; border-radius: 12px; background: #000; transform: scaleX(-1); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Smart Attendance</a>
        <a href="/" class="btn btn-sm btn-outline-light">Back to Home</a>
    </div>
</nav>
<div class="container text-center mt-4">
    <h3>Face Recognition Attendance</h3>
    <p class="text-muted">Look at the camera. Attendance is marked automatically.</p>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480" class="d-none"></canvas>
    <div id="status" class="mt-3"></div>
</div>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusDiv = document.getElementById("status");
let done = false;

navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => { video.srcObject = stream; })
    .catch(() => {
        statusDiv.innerHTML = '<div class="alert alert-danger">Allow camera access, then refresh.</div>';
    });

async function sendFrame() {
    if (done || !video.srcObject || video.readyState < 2) return;
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -640, 0, 640, 480);
    ctx.restore();
    const image = canvas.toDataURL("image/jpeg", 0.8);
    const response = await fetch("/recognize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image })
    });
    const data = await response.json();
    if (data.marked) {
        done = true;
        statusDiv.innerHTML = `<div class="alert alert-success">Attendance marked for ${data.name}</div>`;
        setTimeout(() => { window.location.href = "/"; }, 2500);
    } else {
        statusDiv.innerHTML = `<div class="alert alert-secondary py-2">${data.message}</div>`;
    }
}
setInterval(sendFrame, 800);
</script>
</body>
</html>
