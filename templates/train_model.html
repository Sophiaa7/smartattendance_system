<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Model - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Smart Attendance</a>
        <div class="d-flex gap-3">
            <a href="/add_student" class="btn btn-sm btn-outline-light">Add Student</a>
            <a href="/analytics" class="btn btn-sm btn-outline-light">Analytics</a>
            <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h3 class="mb-3">Train Face Recognition Model</h3>
                    <p class="text-muted">
                        This will train the model using all face images currently in the <code>dataset/</code> folder.
                    </p>

                    {% if message %}
                        <div class="alert alert-{{ message_type }}">
                            {{ message }}
                        </div>
                    {% endif %}

                    <form method="POST">
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            Start Training
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <a href="/add_student" class="btn btn-outline-secondary">← Add Another Student</a>
                        <a href="/analytics" class="btn btn-outline-secondary">Go to Analytics</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
