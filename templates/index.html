<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
        }
        .hero {
            padding: 80px 20px;
        }
        .card-feature {
            border: none;
            border-radius: 16px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .card-feature:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Smart Attendance</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/">Home</a>
                <a class="nav-link" href="/start">Take Attendance</a>
                <a class="nav-link" href="/login">Admin Login</a>
            </div>
        </div>
    </div>
</nav>

<div class="container hero text-center">
    <h1 class="display-5 fw-bold mb-3">Smart Attendance System</h1>
    <p class="lead text-muted mb-5">Fast, contactless face recognition attendance</p>

    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <div class="card card-feature h-100">
                <div class="card-body p-4">
                    <h4 class="card-title">Take Attendance</h4>
                    <p class="card-text text-muted">Stand in front of the camera to mark your attendance automatically.</p>
                    <a href="/start" class="btn btn-primary btn-lg w-100">Start Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card card-feature h-100">
                <div class="card-body p-4">
                    <h4 class="card-title">Admin Panel</h4>
                    <p class="card-text text-muted">View records, analytics and manage the system.</p>
                    <a href="/login" class="btn btn-outline-primary btn-lg w-100">Admin Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
